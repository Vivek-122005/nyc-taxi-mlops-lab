name: deploy-app

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run is also emitted for PR checks. Both conditions protect the self-hosted host.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    env:
      EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Derive the immutable image tag
        run: echo "IMAGE_TAG=sha-${EXPECTED_GIT_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the app stack
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test deployed provenance
        run: |
          actual=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1/version)
          echo "$actual" | jq -e --arg sha "$EXPECTED_GIT_SHA" --arg tag "$IMAGE_TAG" \
            '.service == "app" and .git_sha == $sha and .image_tag == $tag' >/dev/null
